quarkus.package.type=uber-jar
quarkus.smallrye-health.ui.enable=true

mp.messaging.connector.smallrye-amqp.host=activemq
mp.messaging.connector.smallrye-amqp.port=5672
mp.messaging.connector.smallrye-amqp.username=admin
mp.messaging.connector.smallrye-amqp.password=admin

mp.messaging.outgoing.message-out.connector=smallrye-amqp
mp.messaging.outgoing.message-out.address=equipment-data
mp.messaging.outgoing.message-out.durable=true

# mp.messaging.outgoing.health-check.connector=smallrye-amqp
# mp.messaging.outgoing.health-check.address=health-check-address
# mp.messaging.outgoing.health-check.durable=true
smallrye.messaging.health.enabled=false


quarkus.log.category."org.apache.activemq".level=DEBUG
quarkus.log.category."io.quarkus.smallrye.health".level=DEBUG

quarkus.http.port=8083
quarkus.http.root-path=/api
quarkus.log.level=INFO
