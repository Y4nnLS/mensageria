quarkus.package.type=uber-jar

# Configurações para receber mensagens da fila quote-requests
mp.messaging.connector.smallrye-amqp.host=activemq
mp.messaging.connector.smallrye-amqp.port=5672
mp.messaging.connector.smallrye-amqp.username=admin
mp.messaging.connector.smallrye-amqp.password=admin

mp.messaging.incoming.message-out.connector=smallrye-amqp
mp.messaging.incoming.message-out.address=equipment-data
mp.messaging.incoming.message-out.durable=true

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=admin
quarkus.datasource.password=123
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mensageria_DB
quarkus.hibernate-orm.database.generation=update
